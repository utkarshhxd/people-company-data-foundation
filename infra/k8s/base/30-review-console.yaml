# The only long-running HTTP process in the stack: a browser console for the
# four review queues, the pipeline dashboard, and the operational controls.
# Writes nothing of its own -- every decision goes through the same functions
# the review CLIs call. See docs/guides/review-console.md.
#
# Also the stack's Prometheus target: `/metrics` carries the pipeline gauges
# (review_console/src/review_console/pipeline_metrics.py), which is why
# 40-prometheus.yaml scrapes this Service and not the consumers.
apiVersion: v1
kind: Service
metadata:
  name: review-console
  namespace: pcdf
  labels:
    app: review-console
spec:
  selector:
    app: review-console
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-console
  namespace: pcdf
spec:
  # Single replica, for the same reason the data volume is shared rather than
  # per-pod: the upload form writes files into /data/inbox/uploads for the
  # watcher to pick up, and a second replica would be a second writer with no
  # coordination. The console is not the bottleneck in this system.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: review-console
  template:
    metadata:
      labels:
        app: review-console
    spec:
      securityContext:
        # The image runs as the non-root `app` user, uid/gid 10001 (see the
        # Dockerfile), and a PersistentVolume arrives owned by root -- so
        # without this the one directory this pod exists to write is one it
        # cannot write, and the failure is a bare "Permission denied" with no
        # hint as to why. fsGroup makes the kubelet hand the volume over
        # group-owned by 10001 and group-writable.
        #
        # Compose never needed it: a bind mount of ./data inherits the
        # ownership of a directory the host user already owns.
        fsGroup: 10001
      # No Kubernetes API token in this pod, for two reasons that happen to
      # point the same way.
      #
      # The mechanical one: the secret volume below mounts at /run/secrets, and
      # /var/run is a symlink to /run on every Linux image here. Kubernetes
      # mounts its service-account token at
      # /var/run/secrets/kubernetes.io/serviceaccount, which means creating a
      # directory inside a read-only secret mount. It cannot, and the container
      # fails to start with "mkdirat ... read-only file system" -- before any
      # application code runs, so there is nothing in the logs to explain it.
      #
      # The other one: nothing in this pod calls the Kubernetes API. A token it
      # never uses is a credential sitting in a container for no reason.
      automountServiceAccountToken: false
      # ghcr.io replaces ACR (see docs/decisions/0023-remove-aks-and-acr-dependency.md);
      # unlike ACR's cluster-identity attachment, this needs an explicit pull
      # secret. Created from 04-registry-secret.example.yaml, not by this base.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: review-console
          image: pcdf-review-console:local
          envFrom:
            - configMapRef:
                name: pcdf-config
          env:
            - name: LOG_TO_DATABASE
              value: "true"
            - name: ALERTMANAGER_URL
              value: http://alertmanager:9093
            # Not set as a value: the keys arrive as a mounted file at
            # /run/secrets/pcdf_api_keys, which common.config.resolve() finds
            # without being told to. Unset and unmounted means the console
            # serves only to loopback -- see the Ingress in the next file.
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: data
              mountPath: /data
          # `restart: unless-stopped` in Compose only restarts a container that
          # exited; a process still running but unable to reach Postgres stays
          # up forever serving 503s. /health/ready already answers the
          # question -- this is what makes the answer count for something.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: secrets
          secret:
            secretName: pcdf-secrets
            items:
              - key: postgres_password
                path: postgres_password
              - key: pcdf_api_keys
                path: pcdf_api_keys
        - name: data
          persistentVolumeClaim:
            claimName: pcdf-data
