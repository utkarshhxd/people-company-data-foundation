# Alert on the failure modes that stay silent.
#
# Every container can be green, every request can return 200, and the data can
# still be quietly degrading. These rules watch for that, and almost all of them
# are deliberately about AGE rather than COUNT.
#
# The distinction is the whole design. A queue of three items is fine. A queue
# of three items that has been the same three items for a fortnight is a process
# failure -- somebody stopped reviewing, and no count anywhere reveals it. A
# threshold on depth either fires constantly on a busy day or never fires at
# all; a threshold on age fires exactly when work has stopped moving.
#
# Depth is alerted on only where growth itself is the symptom rather than the
# workload.

groups:
  - name: pcdf-availability
    interval: 30s
    rules:
      - alert: MetricsCannotReachDatabase
        # The exporter deliberately returns 200 with pcdf_metrics_up 0 rather
        # than failing, so nothing else notices. This is the only thing that
        # does.
        expr: pcdf_metrics_up == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Pipeline metrics cannot reach Postgres"
          description: >-
            The API is serving but its metrics collector cannot query the
            database, so every pcdf_ gauge below is stale or absent. Monitoring
            that dies with the database is useless exactly when it is needed.

      - alert: ConsoleDown
        expr: up{job="review-console"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "API is not being scraped"
          description: "Prometheus cannot reach the API. Nothing below is current."

  - name: pcdf-data-integrity
    interval: 30s
    rules:
      - alert: RecordsCommittedButNotPublished
        # Rows land in Postgres before their Kafka events, on purpose, so an
        # event can never reference a row that does not exist. The cost is that
        # a Kafka outage leaves batches whose downstream stages will never be
        # triggered, and nothing else reports it.
        expr: pcdf_batches_events_unpublished > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} batch(es) committed without publishing events"
          description: >-
            Rows are in Postgres but the Kafka events were not published, so no
            downstream stage will run for them. Postgres is the source of truth
            and nothing is lost -- but nothing will happen either until the
            batch is reprocessed.

      - alert: BatchFailed
        expr: increase(pcdf_batches{status="failed"}[1h]) > 0
        labels: {severity: warning}
        annotations:
          summary: "A batch failed in the last hour"
          description: >-
            Its rows stay where they are and are inert downstream, because every
            stage requires a completed batch. Check `process errors`.

      - alert: RecordsFailedToProcess
        expr: pcdf_records_awaiting_resolution > 0
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} validated record(s) never reached an entity"
          description: >-
            These passed validation but have no entity link, which should not
            persist -- resolution runs automatically. A consumer may be stopped.

  - name: pcdf-review-queues
    interval: 30s
    rules:
      # The age alerts. Each fires when work has stopped moving, not when there
      # is a lot of it.
      - alert: QuarantineNotBeingReviewed
        expr: pcdf_oldest_open_quarantine_age_seconds > 7 * 24 * 3600
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Oldest quarantined record has waited {{ $value | humanizeDuration }}"
          description: >-
            A quarantined record loses nothing by waiting, which is exactly why
            nobody notices it waiting. Every one of these is a record held back
            from becoming an entity until a human decides.

      - alert: MappingsNotBeingReviewed
        expr: pcdf_oldest_unreviewed_mapping_age_seconds > 7 * 24 * 3600
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Oldest unreviewed column mapping is {{ $value | humanizeDuration }} old"
          description: >-
            An unreviewed mapping means those values are captured but attributed
            to no canonical field, so they are never validated and never
            resolved on. The data is arriving and being ignored.

      - alert: MatchCandidatesNotBeingReviewed
        expr: pcdf_oldest_open_match_candidate_age_seconds > 14 * 24 * 3600
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "Oldest possible-duplicate has waited {{ $value | humanizeDuration }}"
          description: >-
            Each open candidate means one real-world thing is probably
            represented by two ids. Longer than quarantine on purpose: these are
            judgement calls about ambiguous evidence, not backlog.

      - alert: MatchCandidatesGrowingFast
        # Depth, not age, and the only queue alerted on that way: a sudden surge
        # means a load introduced systematic ambiguity -- a vendor whose records
        # match everything -- which is worth knowing before the load finishes.
        expr: increase(pcdf_match_candidates{status="open"}[1h]) > 500
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} new possible-duplicates in the last hour"
          description: >-
            A surge usually means a source is producing systematically ambiguous
            matches rather than that reviewers fell behind.

  - name: pcdf-data-quality
    interval: 30s
    rules:
      - alert: RecordsBeingQuarantined
        expr: increase(pcdf_records_validated{status="invalid"}[1h]) > 100
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} records became invalid in the last hour"
          description: >-
            A vendor's format probably changed, or a mapping is wrong. Invalid
            means not safe to resolve, so these are held rather than lost.

      - alert: UnmappedColumnsHigh
        # Ratio, not count: a wide vendor file legitimately produces many
        # uncanonical observations, so an absolute number would alert on the
        # file rather than on a problem.
        expr: >-
          pcdf_observations_uncanonical / clamp_min(pcdf_attribute_observations, 1) > 0.75
        for: 1h
        labels: {severity: info}
        annotations:
          summary: "{{ $value | humanizePercentage }} of observations map to no field"
          description: >-
            Values are being captured but not made canonical. Expected for
            vendor telemetry columns; worth checking the mapping review queue if
            it climbs.

  # ------------------------------------------------------------------------
  # The broker, and the processes that work from it. These are new alongside
  # the ones above: the batch path became event-driven again (ADR 0018), and
  # the failures that introduces are ones nothing else notices.
  # ------------------------------------------------------------------------
  - name: pcdf-pipeline-flow
    rules:
      - alert: KafkaUnreachable
        # The lag collector reports 0 rather than failing the scrape, on the
        # same reasoning as pcdf_metrics_up: monitoring that dies with the
        # thing it monitors is useless exactly when it is needed.
        expr: pcdf_kafka_up == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Consumer lag cannot be read from the broker"
          description: >-
            Either the broker is down or the console cannot reach it. While
            this is true, nothing announces a loaded batch and no stage
            consumer advances -- rows still land in Postgres, and every one of
            those batches will need replaying.

      - alert: ConsumerNotKeepingUp
        # Depth, not age, and deliberately generous. A backlog during a large
        # load is the system working; a backlog that survives half an hour is
        # a consumer that is stopped, crash-looping, or slower than the feed.
        expr: sum by (group) (pcdf_kafka_consumer_lag) > 0
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.group }} is {{ $value }} message(s) behind"
          description: >-
            Nothing is lost -- offsets commit only after a batch is processed,
            so the work is waiting rather than dropped. But those batches have
            not reached their next stage, and records loaded through this path
            are not yet resolvable or golden.

      - alert: ServiceLoopStopped
        # Not "the container is down": restart: unless-stopped only acts on a
        # process that exited. A consumer blocked on a broker that accepts
        # connections and never delivers stays up and stops working, and this
        # is the only thing that can tell the difference.
        expr: pcdf_service_heartbeat_age_seconds > 900
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.service }} has not completed a loop in {{ $value | humanizeDuration }}"
          description: >-
            The process is either wedged or gone. If it is the watcher, files
            dropped into a feed are sitting there unread; if it is a consumer,
            its topic is filling up.

      - alert: EnrichmentNotBeingReviewed
        # Same 7 days as quarantine and mappings. A pending proposal is a
        # question nobody answered, and until someone does the guess is not
        # evidence of anything -- it just sits there looking like progress.
        expr: pcdf_oldest_pending_enrichment_age_seconds > 7 * 24 * 3600
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "The oldest AI proposal has waited {{ $value | humanizeDuration }}"
          description: >-
            Nothing is wrong with the data. The enrichment queue has simply
            stopped being worked, and proposals never become observations on
            their own.

      - alert: ModelUnreachable
        # 'error' exists in enrichment_attempt precisely so an outage cannot be
        # read as the model having no opinion. This is what reads it.
        expr: increase(pcdf_enrichment_attempts{outcome="error"}[1h]) > 20
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} enrichment calls failed in the last hour"
          description: >-
            Ollama is probably down or the model is not pulled. Attempts are
            recorded either way, so those (entity, field) pairs will be skipped
            on the next run until their rows are deleted.

      - alert: StagePaused
        # Not a failure -- a pause is a deliberate state and often the right
        # one. This fires on it having lasted, because the failure mode is not
        # stopping, it is forgetting that you did. An hour is long enough that
        # nobody is still actively looking at it.
        expr: pcdf_stage_paused == 1
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.stage }} has been paused for over an hour (by {{ $labels.changed_by }})"
          description: >-
            Nothing is being lost: queued work is waiting in its topic and
            files are sitting in their feed directories. Nothing is moving
            either. Check `validation-control status` for why it stopped, then
            resume it.

      - alert: FilesWaitingToLoad
        # Age rather than depth, the same as every other queue alert here. A
        # queue of five is a busy morning; five that have not moved in half an
        # hour means the worker is not turning -- or ingestion is stopped and
        # nobody has been told.
        expr: pcdf_oldest_waiting_file_age_seconds > 1800
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "A file has been waiting {{ $value | humanizeDuration }} to be loaded"
          description: >-
            Nothing is lost -- the files are on disk and their rows are in
            ingest_queue. Either the console's queue worker has stopped, or
            ingestion is paused, in which case the files show as 'held' with
            the reason attached. The Operations and Intake tabs of
            /admin/page show both.

      - alert: IngestionStoppedAutomatically
        # Distinguished from StagePaused deliberately: this one nobody chose,
        # so the useful time window is much shorter. It also means new work is
        # being refused, which StagePaused on a downstream stage does not.
        expr: pcdf_stage_paused{stage="ingestion",changed_by="supervisor"} == 1
        for: 10m
        labels: {severity: critical}
        annotations:
          summary: "Ingestion stopped itself: a service it depends on is not responding"
          description: >-
            The console stopped ingestion because a consumer, the watcher or
            the broker stopped reporting. New files are held rather than
            loaded, and nothing already in the system was discarded. It starts
            again on its own once everything has been back for three
            consecutive checks; if it has not, the service has not come back.
            /admin/page, Operations, says which one.

      - alert: ServicesAreComplaining
        # A service that has started warning is worth knowing about before
        # anybody reads what it said. Deliberately not per-message: the shape
        # that matters is a rate appearing where there was none.
        expr: sum by (service) (pcdf_service_log_entries{level=~"ERROR|CRITICAL"}) > 10
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.service }} has logged {{ $value }} errors in the last hour"
          description: >-
            Read them on /admin/page, Activity, filtered to errors. The full
            output is still in the container's own log; what is kept in the
            database is WARNING and above.
