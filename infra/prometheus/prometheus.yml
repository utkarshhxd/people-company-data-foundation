global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The console replaced services/api and carries the pipeline gauges now.
  - job_name: "review-console"
    metrics_path: /metrics
    static_configs:
      - targets: ["review_console:8000"]
        labels:
          service: "review-console"
          environment: "local"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]
