# Template, not a real Secret -- same pattern as 02-secret.example.yaml: copy
# it out, fill it in, apply the copy, don't commit the filled-in version.
#
# ACR was attached to the AKS cluster's identity (`--attach-acr`), so nodes
# pulled without any imagePullSecret. ghcr.io has no such attachment
# mechanism for a self-managed cluster -- this Secret is what stands in for
# it. See docs/decisions/0023-remove-aks-and-acr-dependency.md.
#
#   cp infra/k8s/base/04-registry-secret.example.yaml /tmp/ghcr-secret.yaml
#   # edit DOCKER_USERNAME and DOCKER_PASSWORD below
#   kubectl apply -f /tmp/ghcr-secret.yaml
#   rm /tmp/ghcr-secret.yaml
#
# Or skip the file entirely:
#
#   kubectl create secret docker-registry ghcr-pull-secret -n pcdf \
#     --docker-server=ghcr.io \
#     --docker-username=<github-username> \
#     --docker-password=<github-PAT-with-read:packages>
#
# The PAT needs only the `read:packages` scope. Every Deployment/Job/CronJob
# that pulls a pcdf-* image (built by infra/scripts/build-and-push.sh)
# references this Secret by name via imagePullSecrets.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: pcdf
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "CHANGE-ME",
          "password": "CHANGE-ME",
          "auth": "CHANGE-ME-BASE64-OF-USERNAME:PASSWORD"
        }
      }
    }
