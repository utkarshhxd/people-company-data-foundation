# Where a firing alert goes. Self-contained by default: with no webhook
# configured, alerts collect in Alertmanager's own UI and nothing leaves the
# cluster, because a destination is something somebody has to own.
#
# The config is a template rendered at start by infra/alertmanager/entrypoint.sh
# -- Alertmanager does not expand environment variables in its own config, and
# the webhook URL is a credential that must not end up in a config file. Both
# files arrive as a ConfigMap generated by infra/kustomization.yaml; the
# entrypoint is mounted executable (defaultMode below).
#
# To route somewhere, add `alertmanager_webhook_url` to the pcdf-secrets Secret
# and uncomment the env block. Slack, Teams and Discord all take a URL of this
# shape.
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: pcdf
spec:
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: pcdf
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # Small: notification state and silences, not a time series database. A
      # silence somebody set to cover a known-bad feed should survive a
      # restart, which is the whole reason this is not an emptyDir.
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: pcdf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          command: ["/etc/alertmanager/entrypoint.sh"]
          # env:
          #   - name: ALERTMANAGER_WEBHOOK_URL
          #     valueFrom:
          #       secretKeyRef:
          #         name: pcdf-secrets
          #         key: alertmanager_webhook_url
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager/alertmanager.yml.tmpl
              subPath: alertmanager.yml.tmpl
              readOnly: true
            - name: config
              mountPath: /etc/alertmanager/entrypoint.sh
              subPath: entrypoint.sh
              readOnly: true
            # The entrypoint renders the config here and writes the webhook URL
            # here, so this has to be writable -- it is both the storage path
            # and the render target.
            - name: data
              mountPath: /alertmanager
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
            # 0755: the entrypoint is executed, and a ConfigMap's default 0644
            # would fail with "permission denied" before Alertmanager starts.
            defaultMode: 0755
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data
