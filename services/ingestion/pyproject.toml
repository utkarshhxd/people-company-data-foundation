[project]
name = "ingestion-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "polars>=1.17",
    "fastexcel>=0.12",
    "psycopg[binary]>=3.2",
    "confluent-kafka>=2.6",
    "common",
]

[project.scripts]
ingest = "ingestion.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
