name: CI

# Every suite runs in its own container, which is not a preference: polars and
# psycopg's binary driver are native extensions, and the development machine's
# Application Control policy blocks them outside Docker. CI matching that
# exactly is what stops "works in CI" and "works here" from drifting apart.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # ruff check only. `ruff format` is deliberately not enforced: this
      # codebase's line breaking is hand-tuned, particularly in the comments
      # that carry the reasoning, and mandating a formatter now would rewrite
      # ~100 files to settle a question nobody has asked. Lint catches the
      # things that are wrong; formatting here would only make them uniform.
      - run: uvx ruff check .
      # A second pass with the rules the default set leaves off, and the ones
      # that matter here are the security ones: this service reads vendor
      # files and serves personal data, so a hand-built SQL string or an
      # unvalidated path is the class of defect worth a machine's opinion.
      # Advisory rather than blocking -- these rules flag safe patterns too
      # (every dynamic WHERE clause in this codebase is built from literals),
      # and a lint that cries wolf gets switched off. The point is that a new
      # one shows up in the log where someone reads it.
      - name: Security and correctness lint (advisory)
        continue-on-error: true
        run: uvx ruff check --select S,B,ASYNC,PTH,DTZ --ignore S101 --output-format github .

  migrations:
    # Applied against an empty database, because a migration that only works
    # against the schema it was written on top of is not a migration.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: pcdf_dev
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: pcdf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pcdf_dev -d pcdf"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Apply every migration from empty
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: pcdf_dev
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: pcdf
          PCDF_MIGRATIONS_DIR: db/migrations
        run: uv run --frozen --package common python -m common.migrations
      - name: Applying them twice must change nothing
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: pcdf_dev
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: pcdf
          PCDF_MIGRATIONS_DIR: db/migrations
        run: uv run --frozen --package common python -m common.migrations

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - ingestion
          - mapping
          - normalization
          - validation
          - resolution
          - golden
          - record_pipeline
          - enrichment
          - review_console
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          tags: pcdf-${{ matrix.service }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # `uv run` is spelled out because plain `docker run` has no entrypoint.
      # Locally these are invoked through `docker compose run`, which supplies
      # entrypoint: ["uv", "run", "--frozen", "--no-sync"] -- so the image is
      # built expecting it, and calling `python` directly gets the system
      # interpreter with none of the dependencies installed.
      - name: Test ${{ matrix.service }}
        run: >-
          docker run --rm pcdf-${{ matrix.service }}:ci
          uv run --frozen --no-sync python -m pytest tests -v
      # `common` has no image of its own, and building one for a handful of
      # functions that touch no database would be more infrastructure than
      # this needs. Any service image already carries it; ingestion's is as
      # good as any, and this only needs to run once, not once per service.
      - name: Test common
        if: matrix.service == 'ingestion'
        run: >-
          docker run --rm pcdf-${{ matrix.service }}:ci
          uv run --frozen --no-sync python -m pytest libs/common/tests -v
