# Consumes records.validated, links records to a stable person_id/company_id,
# publishes entities.resolved.
#
# One replica. Each consumer is a single member of its own consumer group, and
# the work it does is transactional against Postgres rather than partitioned
# across pods -- a second replica would contend for the same batches rather
# than halve the time they take. Scaling out is a partitioning change in the
# topics first, not a `replicas: 2` here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: resolution
  namespace: pcdf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: resolution
  template:
    metadata:
      labels:
        app: resolution
    spec:
      # No Kubernetes API token in this pod, for two reasons that happen to
      # point the same way.
      #
      # The mechanical one: the secret volume below mounts at /run/secrets, and
      # /var/run is a symlink to /run on every Linux image here. Kubernetes
      # mounts its service-account token at
      # /var/run/secrets/kubernetes.io/serviceaccount, which means creating a
      # directory inside a read-only secret mount. It cannot, and the container
      # fails to start with "mkdirat ... read-only file system" -- before any
      # application code runs, so there is nothing in the logs to explain it.
      #
      # The other one: nothing in this pod calls the Kubernetes API. A token it
      # never uses is a credential sitting in a container for no reason.
      automountServiceAccountToken: false
      # ghcr.io replaces ACR (see docs/decisions/0023-remove-aks-and-acr-dependency.md);
      # unlike ACR's cluster-identity attachment, this needs an explicit pull
      # secret. Created from 04-registry-secret.example.yaml, not by this base.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: resolution
          image: pcdf-resolution:local
          command: ["uv", "run", "--frozen", "--no-sync", "resolution-consumer"]
          envFrom:
            - configMapRef:
                name: pcdf-config
          env:
            # Per-service, so one consumer's stalled heartbeat cannot be
            # mistaken for another's.
            - name: PCDF_HEARTBEAT
              value: /tmp/pcdf-resolution-consumer-heartbeat
            # WARNING and above is copied into `service_log` as well as stdout,
            # so the console's Activity tab can show what this service said
            # without cluster access to eleven pods' logs. Dropped rather than
            # blocking if Postgres cannot keep up; see
            # libs/common/src/common/dblog.py. Set here rather than in the
            # ConfigMap because the migrate Job shares that ConfigMap and has
            # no console watching it.
            - name: LOG_TO_DATABASE
              value: "true"
          # No POSTGRES_PASSWORD env var here: common.config.resolve() finds
          # the mounted secret at /run/secrets/postgres_password on its own.
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          # A process that is running is not the same as a process that is
          # consuming: one wedged mid-batch keeps the pod Running while its
          # topic backs up. It touches the heartbeat after every completed
          # batch, so staleness is the signal -- the same check the Compose
          # healthcheck makes.
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - "import os,sys,time; p=os.environ['PCDF_HEARTBEAT']; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < float(os.environ['PCDF_STALE_AFTER']) else 1)"
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: secrets
          secret:
            secretName: pcdf-secrets
            items:
              - key: postgres_password
                path: postgres_password
