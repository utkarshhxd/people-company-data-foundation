# The `migrate` Compose service as a Job instead of a container that starts,
# runs once and exits under `restart: unless-stopped` -- Kubernetes has a
# purpose-built object for exactly that shape and Compose does not.
#
# Not wired as a Helm pre-install hook or an initContainer on every consumer:
# this repository has no Helm chart (see infra/k8s/README.md for why), and an
# initContainer per Deployment would run the same migration five times
# concurrently on first rollout. Apply this and wait for it to complete before
# applying the Deployments in 2x-*.yaml -- the deploy order is spelled out in
# infra/k8s/README.md.
#
# Compose additionally bind-mounts ./db over the image's baked-in copy, so a
# migration added on disk is picked up without a rebuild. There is no host to
# bind from here, so this Job runs whatever db/migrations/ the image was built
# with -- correct for a versioned artifact, but it means a new migration
# requires rebuilding pcdf-ingestion before it takes effect.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: pcdf
spec:
  # Ten, not three. On a cold cluster this Job and Postgres are created in the
  # same breath, and Postgres has a disk to attach and a database to initialise
  # first -- so the first few attempts failing to connect is the normal case,
  # not the broken one. Three attempts with exponential backoff gives up around
  # a minute in and marks the Job Failed permanently, which then has to be
  # deleted and recreated by hand. Ten costs nothing when the schema is already
  # there (the first attempt succeeds) and covers a slow first boot.
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      # No Kubernetes API token in this pod, for two reasons that happen to
      # point the same way.
      #
      # The mechanical one: the secret volume below mounts at /run/secrets, and
      # /var/run is a symlink to /run on every Linux image here. Kubernetes
      # mounts its service-account token at
      # /var/run/secrets/kubernetes.io/serviceaccount, which means creating a
      # directory inside a read-only secret mount. It cannot, and the container
      # fails to start with "mkdirat ... read-only file system" -- before any
      # application code runs, so there is nothing in the logs to explain it.
      #
      # The other one: nothing in this pod calls the Kubernetes API. A token it
      # never uses is a credential sitting in a container for no reason.
      automountServiceAccountToken: false
      # ghcr.io replaces ACR (see docs/decisions/0023-remove-aks-and-acr-dependency.md);
      # unlike ACR's cluster-identity attachment, this needs an explicit pull
      # secret. Created from 04-registry-secret.example.yaml, not by this base.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: migrate
          image: pcdf-ingestion:local
          command: ["uv", "run", "--frozen", "--no-sync", "python", "-m", "common.migrations"]
          envFrom:
            - configMapRef:
                name: pcdf-config
          # No POSTGRES_PASSWORD env var here: common.config.resolve() finds
          # the mounted secret at /run/secrets/postgres_password on its own.
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: pcdf-secrets
            items:
              - key: postgres_password
                path: postgres_password
