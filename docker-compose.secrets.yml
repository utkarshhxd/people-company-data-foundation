# Credentials from files instead of from the environment.
#
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
#
# An overlay rather than the default, because the default has to work on a fresh
# clone with nothing but `cp .env.example .env`, and a secrets file that must
# exist before anything starts is not that. This is the file to use everywhere
# else.
#
# What changes: POSTGRES_PASSWORD stops being an environment variable --
# visible in `docker inspect`, in `/proc/<pid>/environ`, and to anything else
# running in the container -- and becomes a file readable only by the service
# that needs it. `common.config.resolve` reads `/run/secrets/<name>` without
# being told to, which is the same path a Kubernetes secret volume mounts at,
# so moving to a real secret store later changes this file and no application
# code.
#
# Create the file first (it is gitignored):
#
#   mkdir -p secrets
#   printf '%s' 'a-strong-password' > secrets/postgres_password
#
# Then set POSTGRES_PASSWORD in .env to the same value for this run only -- the
# postgres image itself needs POSTGRES_PASSWORD_FILE, which is wired below, so
# the .env value is used by nothing after that.

secrets:
  postgres_password:
    file: ./secrets/postgres_password

services:
  postgres:
    environment:
      # The official image reads the password from a file when told to, and
      # refuses to start with both set. Cleared to the empty string rather than
      # omitted: an omitted key inherits from .env, which is what "both are set"
      # means. Empty is also what makes common.config fall through to the file.
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]

  migrate:
    environment:
      POSTGRES_PASSWORD: ""
    secrets: [postgres_password]

  ingestion:
    environment:
      POSTGRES_PASSWORD: ""
    secrets: [postgres_password]

  pipeline:
    environment:
      POSTGRES_PASSWORD: ""
    secrets: [postgres_password]

  watcher:
    environment:
      POSTGRES_PASSWORD: ""
    secrets: [postgres_password]

  mapping:
    environment:
      POSTGRES_PASSWORD: ""
    secrets: [postgres_password]

  normalization:
    environment:
      POSTGRES_PASSWORD: ""
    secrets: [postgres_password]

  validation:
    environment:
      POSTGRES_PASSWORD: ""
    secrets: [postgres_password]

  resolution:
    environment:
      POSTGRES_PASSWORD: ""
    secrets: [postgres_password]

  golden:
    environment:
      POSTGRES_PASSWORD: ""
    secrets: [postgres_password]

  review_console:
    environment:
      POSTGRES_PASSWORD: ""
    secrets: [postgres_password]
