[project]
name = "mapping-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "common",
]

[project.scripts]
map-schema = "mapping.cli:main"
review-mappings = "mapping.review:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mapping"]
