# Template, not a real Secret -- copy it out of base/ before filling it in, the
# same way docker-compose.secrets.yml's header tells you to create
# secrets/postgres_password by hand rather than commit it.
#
#   cp infra/k8s/base/02-secret.example.yaml /tmp/pcdf-secrets.yaml
#   # edit the values in /tmp/pcdf-secrets.yaml
#   kubectl apply -f /tmp/pcdf-secrets.yaml
#   rm /tmp/pcdf-secrets.yaml
#
# Or skip the file entirely and let kubectl build it:
#
#   kubectl create secret generic pcdf-secrets -n pcdf \
#     --from-literal=postgres_password="$(openssl rand -base64 24)" \
#     --from-literal=grafana_admin_password="$(openssl rand -base64 24)" \
#     --from-literal=pcdf_api_keys="$(openssl rand -hex 32)"
#
# Keys are lowercase and match the filenames libs/common/src/common/config.py
# already reads from /run/secrets/<name> -- this Secret is mounted at that
# path (see the volumeMounts on postgres, the consumers, watcher and console),
# so no application code changes for the file-based seam to work.
apiVersion: v1
kind: Secret
metadata:
  name: pcdf-secrets
  namespace: pcdf
type: Opaque
stringData:
  postgres_password: CHANGE-ME

  # Grafana's own login. An unset admin password is how a dashboard ends up on
  # the internet with admin/admin.
  grafana_admin_password: CHANGE-ME

  # Comma-separated, and load-bearing the moment the console is reachable from
  # outside the cluster: with no keys configured it serves only to loopback,
  # which through an Ingress means every request is refused with 503. See
  # 31-review-console-ingress.yaml -- the console shows personal data with full
  # provenance, so this is the thing standing between it and the internet.
  # Two values, so one can be rotated without a window where neither works.
  pcdf_api_keys: CHANGE-ME,CHANGE-ME-TOO
