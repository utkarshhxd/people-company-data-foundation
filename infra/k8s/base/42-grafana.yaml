# The dashboards, provisioned from the same files Compose mounts
# (infra/grafana/provisioning/) via ConfigMaps generated in
# infra/kustomization.yaml -- so a panel edited on disk is the panel that
# appears here, and neither copy drifts.
#
# No Ingress. Grafana reads the same Prometheus the console does and shows no
# personal data, but it is still an admin surface; reach it with
#   kubectl port-forward -n pcdf svc/grafana 3000:3000
# and add an Ingress deliberately if it needs to be permanent.
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: pcdf
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: pcdf
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # Grafana's own SQLite: users, preferences, and any dashboard saved
      # through the UI. The provisioned ones come from the ConfigMaps.
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: pcdf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        # Grafana's image runs as uid 472.
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.1.1
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pcdf-secrets
                  key: grafana_admin_password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
              readOnly: true
            # The path dashboards.yml points its file provider at.
            - name: dashboard-json
              mountPath: /etc/grafana/provisioning/dashboards/json
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 30
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-json
          configMap:
            name: grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
