# Scrapes the console's /metrics and evaluates infra/prometheus/rules/. Both
# its config and those rules arrive as ConfigMaps generated by
# infra/kustomization.yaml from the same files Compose mounts, so a rule is
# written once and runs in both places.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: pcdf
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: pcdf
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: pcdf
spec:
  replicas: 1
  # Two Prometheus pods cannot share one ReadWriteOnce volume, and a rolling
  # update would try. Recreate: a gap of seconds in scraping, rather than a
  # deployment that never completes.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        # The image's own user. Without this the PersistentVolume arrives
        # owned by root and Prometheus cannot write its TSDB.
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.2
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # Bounded, so the volume above is a size and not a hope.
            - --storage.tsdb.retention.time=90d
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
