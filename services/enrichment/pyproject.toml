[project]
name = "enrichment-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "common",
    # Reuses the existing value normalizers and the golden-record builder
    # rather than reimplementing either: an AI-authored value must be made
    # comparable and folded into survivorship exactly the way a vendor's is.
    "normalization-service",
    "golden-service",
]

[project.scripts]
enrich = "enrichment.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
]

[tool.uv.sources]
common = { workspace = true }
normalization-service = { workspace = true }
golden-service = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enrichment"]
