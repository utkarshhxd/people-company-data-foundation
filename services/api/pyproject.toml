[project]
name = "api-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "confluent-kafka>=2.6",
    "prometheus-fastapi-instrumentator>=7.0",
    "pydantic-settings>=2.6",
    # Reading Alertmanager. A runtime dependency, not a test one: the alerts
    # projection calls it on every request.
    "httpx>=0.27",
    "common",
    # The review console decides nothing itself. Approving a mapping, accepting
    # a merge and releasing a record from quarantine all go through the same
    # functions the CLIs call, so a decision made in a browser and the same
    # decision made in a terminal cannot diverge.
    "mapping-service",
    "validation-service",
    "resolution-service",
    "golden-service",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.uv.sources]
common = { workspace = true }
mapping-service = { workspace = true }
validation-service = { workspace = true }
resolution-service = { workspace = true }
golden-service = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_service"]
